<html>
    <head>
        <title>Remove Page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>Remove Vehicle</h1>
        <p>
            Enter the number plate of the vehicle to remove
        </p>
        
        <form action="removeServlet" method="POST">
            <table>
                <tr>
                        <td>Number Plate:</td>
                        <td><input type="text" name="plate" required="" /></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input type="submit" value="REMOVE" /></td>
                    </tr>
            </table>
        </form>
    </body>
</html>
